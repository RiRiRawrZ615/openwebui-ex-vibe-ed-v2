# Open Web Vibes packaged defaults. Read as data by the launcher, never evalled.
# A user file at ~/.config/openwebvibes/owv.conf wins over this one.
# Every path here derives from HOME or XDG at runtime; nothing in the launcher hardcodes a machine.

port=8080
model_port=8001
vision_port=8002
terminal_port=8004

data_dir=${HOME}/.local/share/openwebvibes
runtime_dir=${XDG_CACHE_HOME:-${HOME}/.cache}/openwebvibes
log_dir=${XDG_STATE_HOME:-${HOME}/.local/state}/openwebvibes
model_root=${HOME}/Documents/AI_Models

# Leave empty to resolve from PATH at start. Setting a path here is the override the launcher
# prefers, which is what an existing stack needs and what a fresh machine does not.
llama_bin=
strata_bin=
