# Open Web Vibes v2 packaged defaults. Read as data by the launcher, never evalled.
# A user file at ~/.config/openwebvibes-v2/owv.conf wins over this one.
# Every path here derives from HOME or XDG at runtime; nothing in the launcher hardcodes a machine.

# Only OWV_ names and EX_MODEL_ROOTS are accepted by the launcher's parser, so the keys below are
# spelled that way on purpose. A lowercase `port=` line reads like config and does nothing; the
# parser skips it. This file is written in the shape the parser actually honors.

# Ports kept apart from v1 and from the stock instance so both forks can serve at once.
# v1 and stock use 8080 / 8001-8004; v2 uses 8085 / 8005-8007.
OWV_WEBUI_PORT=8085
OWV_API_PORT=8005
OWV_VISION_PORT=8007
OWV_TERMINAL_PORT=8006

# v2's own name-space. Never shares a directory with v1, so one instance cannot read the other's
# database, and a kill scoped to v2 cannot reach v1's runtime dir.
OWV_DATA_DIR=${HOME}/.local/share/openwebvibes-v2
OWV_RUNTIME_DIR=${XDG_CACHE_HOME:-${HOME}/.cache}/openwebvibes-v2
OWV_LOG_DIR=${XDG_STATE_HOME:-${HOME}/.local/state}/openwebvibes-v2

OWV_MODEL_ROOT=${HOME}/Documents/AI_Models
OWV_PROFILES_DIR=${HOME}/Documents/llama_profiles

# Leave empty to resolve from PATH at start. Setting a path here is the override the launcher
# prefers, which is what an existing stack needs and what a fresh machine does not.
OWV_LLAMA_BIN=
OWV_STRATA_BIN=
OWV_STRATA_DIR=${HOME}/strata

# Engine selection: auto, llama, or strata.
OWV_BACKEND=auto

# Optional billion-context proxy. Off by default so a plain run is identical to no proxy at all.
OWV_CONTEXT_PROXY=0
# Proxy tuning is env-only (BILI_PORT, BILI_BIN, BILI_TTL, BILI_MAX_CONTEXT,
# BILI_MAX_COMPLETION, OWV_UPSTREAM_URL, OWV_PROXY_URL). The parser accepts only OWV_ names and
# EX_MODEL_ROOTS, so a bare BILI_PORT line in this file is skipped. Set it in the shell instead.

# Fork venv: the packaged launcher resolves it as the package root's own .venv
# (/usr/lib/openwebvibes-v2/.venv), which is where ensure-venv.sh fills it. Do not set
# OWV_PYTHON here unless you mean to point the fork at a different interpreter.
